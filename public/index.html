<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3370ff">
  <title>商品价目查询</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 口令解锁 -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card" autocomplete="off">
      <h1>商品价目查询</h1>
      <p class="gate-sub">内部使用，请输入访问口令</p>
      <input id="gate-input" type="password" placeholder="访问口令" autocomplete="current-password" required>
      <button type="submit" id="gate-submit">进入</button>
      <p id="gate-error" class="gate-error" hidden></p>
    </form>
  </div>

  <!-- 主应用（移动端优先） -->
  <div id="app" class="shell" hidden>
    <header class="bar">
      <div class="bar-row">
        <h1>商品价目查询</h1>
        <button id="lock-btn" class="ghost" type="button">锁定</button>
      </div>
      <p class="meta">
        <span id="meta-count"></span>
        <span class="dot">·</span>
        更新于 <span id="meta-time"></span>
      </p>
    </header>

    <section class="filters">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input id="q" type="search" placeholder="商品名称 / 拼音 / 条码"
               inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off">
        <button id="clear-btn" class="clear" type="button" aria-label="清空" hidden>&times;</button>
      </div>

      <div class="selects">
        <select id="brand" aria-label="商品品牌"><option value="">全部品牌</option></select>
        <select id="cat" aria-label="所属分类"><option value="">全部分类</option></select>
      </div>

      <div class="status">
        <span id="result-count"></span>
        <span id="tag-exact" class="tag" hidden>条码精确匹配</span>
        <button id="reset-btn" class="link" type="button">重置</button>
      </div>
    </section>

    <main id="list" class="list"></main>
    <p id="empty" class="empty" hidden>没有匹配的商品</p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
